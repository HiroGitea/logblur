[cli]
about = "清洗 Linux 日志压缩包里的敏感信息（口令、密钥、IP/MAC 地址、邮箱、用户名、主机名……），全程在内存中处理。"
after_help = """
示例：
  logblur logs.zip                         # 在旁边生成 logs.blurred.zip
  logblur -l 4 -m pseudo --salt s3 logs.tar.gz
  journalctl -b | logblur - > boot.txt
  logblur preview logs.zip -n 30 --show-original
  logblur rules list --all
  logblur rules test "Accepted publickey for alice from 203.0.113.5"

界面语言：--lang、LOGBLUR_LANG、LANGUAGE、LC_ALL、LC_MESSAGES 或 LANG（见 `logblur languages`）。
退出码：0 成功，1 用法或配置错误，2 处理失败，3 已取消。"""

