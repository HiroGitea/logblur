# logblur —— 简体中文译文。占位符形如 {name}；键与 en.toml 保持一致。

[meta]
tag = "zh-CN"
name = "简体中文"

[error]
io = "{context}：{source}"
zip = "zip 错误（{context}）：{source}"
config = "配置错误：{msg}"
rule = "规则 {rule} 编译失败：{msg}"
output_exists = "输出已存在：{path}（使用 --force 覆盖）"
unsupported = "不支持：{msg}"
cancelled = "已取消"

[io]
access = "无法访问 {path}"
open = "无法打开 {path}"
read = "读取 {path}"
create = "无法创建 {path}"
write = "写入 {path}"
rename = "无法改名为 {path}"
mkdir = "无法创建目录 {path}"
read_dir = "无法读取目录 {path}"
read_entry = "读取第 {index} 个条目"
read_link = "读取链接 {path}"
read_tar = "读取 tar 包"
read_tar_entry = "读取 tar 条目"
decompress = "解压 {path}"
compress = "压缩 {path}"
write_link = "写入链接 {path}"
temp_create = "在 {path} 创建临时文件"
temp_io = "读写临时文件"
write_output = "写入输出"
write_stdout = "写入标准输出"
read_config = "读取配置文件 {path}"
write_report = "无法写入报告 {path}"

[config]
level_range = "保密等级需在 1–4 之间，当前为 {level}"
fixed_width = "fixed_width 需在 1–64 之间"
hash_len = "hash_len 需在 4–64 之间"
mask_newline = "打码字符不能是换行符"
fallback_ascii = "fallback_char 必须是 ASCII 字符"
chunk_small = "chunk_size 过小"
bad_percent = "无效的内存百分比：{value}"
percent_range = "内存百分比需在 1–100 之间：{value}"
bad_size = "无效的内存大小：{value}（示例：2G、512M、70%）"
bad_allow_regex = "允许名单正则无效 {re}：{err}"
bad_cidr = "无效的网段：{value}"
custom_no_group = "自定义规则 {id} 没有第 {group} 个捕获组"
bad_deny = "拒绝名单无效：{err}"
too_many_rules = "规则太多"
learned_build = "构建已学习标识失败：{err}"
same_io = "输出不能与输入相同：{path}"
stdout_multi = "含多个文件的压缩包或目录不能输出到标准输出"
template = '''
# logblur 配置文件（TOML）。所有字段都可省略；命令行参数优先于这里的设置。

# 保密等级：1=凭据  2=+身份信息  3=+网络与设备标识（默认）  4=偏执
level = 3

# 打码方式：block（默认，逐字符 ░）| fixed | star | tag | pseudo | partial | remove | hash
mask = "block"
mask_char = "░"
# 输出编码无法表示 mask_char 时（如 windows-1252）改用的字符
fallback_char = "*"
fixed_width = 6
hash_len = 12

# pseudo / hash 模式的盐。固定它可以让多次运行、多个压缩包得到相同的代号。
# salt = "change-me"
# pseudo 模式使用 IP_1、IP_2 这样的递增编号（单线程，保证编号确定）
counter = false

# 类别微调（id 见 `logblur rules list`）
# only = ["password", "api_key", "ipv4"]   # 只处理这些
enable = []                                # 在当前等级之外额外启用，如 ["timestamp", "hardware_id"]
skip = []                                  # 关闭，如 ["uuid"]
mask_dates = false

keep_private_ips = false   # 保留 10.x / 172.16-31.x / 192.168.x / fc00::/7
learn = true               # 两遍扫描：先学到用户名/主机名，再在全文中清洗
scrub_names = true         # 同时清洗压缩包内的文件名

# 允许名单：精确值（大小写不敏感）、*.后缀、前缀*、CIDR、re:正则
allow = [
  # "203.0.113.0/24",
  # "*.mirror.example.org",
  # "build-server-01",
]

# 拒绝名单：总要打码的词（大小写不敏感），或 re:正则
deny = [
  # "Acme Corp",
  # "re:(?i)project[-_ ]falcon",
]

# 自定义规则：pattern 为 Rust regex 语法；group 指定打码的捕获组
# [[custom_rules]]
# id = "order-id"
# pattern = 'ORD-[0-9]{10}'
# category = "custom"
# level = 1
#
# [[custom_rules]]
# id = "employee-id"
# pattern = '(?i)emp(?:loyee)?[_ -]?id[=: ]+([A-Z0-9]{6,})'
# group = 1

# threads = 8              # 默认使用全部逻辑核
memory = "auto"            # auto | 2G | 512M | 70%
binary = "copy"            # copy | drop  二进制条目原样复制或丢弃
output_encoding = "preserve"   # preserve | utf8
'''

