# 规则夹具：每个 case 用 tag 打码模式清洗 input，
# masked 里的子串必须从输出中消失，kept 里的子串必须保留，tags 里的标签必须出现。
# 所有数据都是虚构的（RFC 5737 文档地址、测试卡号、示例证件号）。

[[case]]
name = "sshd invalid user"
level = 3
input = "Oct 23 11:12:13 web-prod-01 sshd[2211]: Failed password for invalid user admin2 from 203.0.113.45 port 52234 ssh2"
masked = ["web-prod-01", "admin2", "203.0.113.45"]
kept = ["sshd[2211]", "Failed password for invalid user", "port 52234", "ssh2"]
tags = ["HOST", "USER", "IPV4"]

[[case]]
name = "sshd accepted publickey with fingerprint"
level = 3
input = "Oct 23 11:15:02 web-prod-01 sshd[2301]: Accepted publickey for alice from 198.51.100.7 port 50122 ssh2: ED25519 SHA256:Hx2b1QKcOoa1L3dHmC7yJ4z5eQ8mN0pR6sT9uV2wX3Y"
