[workspace]
resolver = "3"
members = ["crates/logblur-core", "crates/logblur", "crates/logblur-gui"]
default-members = ["crates/logblur-core", "crates/logblur"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Scrub sensitive data from Linux log archives (zip / tar.gz / files) in memory"
repository = "https://github.com/HiroGitea/logblur"
homepage = "https://github.com/HiroGitea/logblur"
readme = "README.md"
keywords = ["logs", "anonymization", "redaction", "privacy", "sanitize"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
logblur-core = { path = "crates/logblur-core", version = "0.2.2" }
crossbeam-channel = "0.5.17"

[profile.dev]
debug = "line-tables-only"

# Build dependencies with optimizations: regexes must be fast even in debug builds so tests stay quick.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
