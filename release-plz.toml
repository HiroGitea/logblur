# release-plz: after a merge to main it opens a "version bump + CHANGELOG" PR; merging that PR publishes the release.
# All three crates share one version; only logblur gets a tag and a GitHub Release, and its CHANGELOG covers
# changes in all three crates.

[workspace]
release_always = false
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "logblur"
version_group = "logblur"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["logblur-core", "logblur-gui"]

[[package]]
name = "logblur-core"
version_group = "logblur"

[[package]]
name = "logblur-gui"
version_group = "logblur"
